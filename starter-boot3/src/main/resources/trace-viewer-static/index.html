<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Request Flow Visualizer</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app">
    <header class="app-header">
        <h1>Request Flow Visualizer</h1>
        <div class="controls">
            <label class="auto-refresh">
                <input type="checkbox" id="auto-refresh-toggle">
                자동 새로고침 (3s)
            </label>
            <button id="refresh-btn">새로고침</button>
            <button id="clear-btn" class="danger">전체 삭제</button>
        </div>
    </header>
    <div class="app-body">
        <aside class="trace-list-panel">
            <ul id="trace-list" class="trace-list"></ul>
        </aside>
        <main class="trace-detail-panel">
            <div id="trace-detail" class="trace-detail">
                <p class="empty-state">왼쪽 목록에서 요청을 선택하세요.</p>
            </div>
        </main>
    </div>
</div>
<script src="./app.js"></script>
</body>
</html>
